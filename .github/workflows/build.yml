name: Build APK
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: ZIP url
        required: false
      tag:
        description: Tag
        required: false
      build_type:
        description: Build type
        required: false
      mode:
        description: Build mode
        required: false
        default: release
      file:
        description: File
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Download ZIP
        run: |
          ls -la
          echo "URL: ${{ inputs.zip_url }}"
          if [ -n "${{ inputs.zip_url }}" ]; then
            curl -L --max-time 300 -o source.zip "${{ inputs.zip_url }}" || wget -O source.zip "${{ inputs.zip_url }}"
            ls -lh source.zip
            unzip -o source.zip -d . || true
          else
            unzip -o *.zip -d . || true
          fi
          ls -la
      - name: Build APK
        run: |
          DIR=$(find . -maxdepth 4 -name "pubspec.yaml" | head -n 1 | xargs dirname)
          echo "Found dir: $DIR"
          cd $DIR
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: apk-result
          path: "**/build/app/outputs/flutter-apk/*.apk"
