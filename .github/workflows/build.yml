name: Build APK
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: ZIP url
        required: false
      tag:
        description: Tag
        required: false
      build_type:
        description: Build type
        required: false
      mode:
        description: Build mode
        required: false
        default: release
      file:
        description: File
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Download ZIP
        run: |
          if [ ! -z "${{ inputs.zip_url }}" ]; then
            wget -O source.zip "${{ inputs.zip_url }}" || curl -L -o source.zip "${{ inputs.zip_url }}"
            unzip -o source.zip -d .
          else
            unzip -o "*.zip" -d . || true
          fi
      - name: Build APK
        run: |
          DIR=$(find . -maxdepth 4 -name "pubspec.yaml" | head -n 1 | xargs dirname)
          cd $DIR
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: apk-result
          path: "**/build/app/outputs/flutter-apk/*.apk"
