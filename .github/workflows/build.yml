name: Build APK
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: ZIP url
        required: false
      tag:
        description: Tag
        required: false
      build_type:
        description: Build type
        required: false
      mode:
        description: Build mode
        required: false
        default: release
      file:
        description: File
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
            - uses: actions/checkout@v4

            - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

            - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

            - name: Download & Extract ZIP
        run: |
          set -ex
          rm -rf source.zip project
          mkdir -p project
          echo "ZIP_URL=${{ inputs.zip_url }}"
          echo "FILE=${{ inputs.file }}"
          ls -la
          if [ -n "${{ inputs.zip_url }}" ]; then
            curl -L -v -k --retry 3 -o source.zip "${{ inputs.zip_url }}"
            ls -lh source.zip
          fi
          if [ -n "${{ inputs.file }}" ] && [ -f "${{ inputs.file }}" ]; then
            cp "${{ inputs.file }}" source.zip || true
          fi
          find . -maxdepth 2 -name "*.zip" -ls
          for z in $(find . -maxdepth 2 -name "*.zip"); do
            echo "Unzipping $z"
            unzip -o "$z" -d project || true
          done
          echo "=== ISI PROJECT ==="
          ls -la project
          find project -maxdepth 3 -type f | head -n 100
          if [ -z "$(ls -A project)" ]; then
            echo "PROJECT KOSONG! ZIP GAK KE-DOWNLOAD!"
            exit 1
          fi

            - name: Build APK
        run: |
          set -x
          PUB=$(find project -name "pubspec.yaml" | head -n 1)
          if [ -n "$PUB" ]; then
            echo "FLUTTER PROJECT DETECTED: $PUB"
            DIR=$(dirname "$PUB")
            cd "$DIR"
            flutter clean
            flutter pub get
            flutter build apk --release --no-tree-shake-icons -v
            mkdir -p /tmp/apk
            cp -r build/app/outputs/flutter-apk/* /tmp/apk/ || true
            find build -name "*.apk" -exec cp {} /tmp/apk/ \; || true
          else
            echo "ANDROID NATIVE"
            GRADLE=$(find project -name "gradlew" | head -n 1)
            if [ -z "$GRADLE" ]; then
              find project -type f -name "*.gradle" | head -n 20
              exit 1
            fi
            DIR=$(dirname "$GRADLE")
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleRelease --stacktrace
            mkdir -p /tmp/apk
            find . -name "*.apk" -exec cp {} /tmp/apk/ \;
          fi
          ls -lh /tmp/apk/

            - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-result
          path: /tmp/apk/*.apk
          if-no-files-found: error
