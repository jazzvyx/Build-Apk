name: Build APK
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        required: true
        default: release
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          unzip -o "*.zip" -d . || true
          DIR=$(find . -name "pubspec.yaml" | head -n 1 | xargs dirname)
          cd $DIR
          flutter pub get
          flutter build apk --${{ github.event.inputs.mode }}
      - uses: actions/upload-artifact@v4
        with:
          name: apk-result
          path: "**/build/app/outputs/flutter-apk/*.apk"
