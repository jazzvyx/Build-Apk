name: Build APK
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: ZIP url
        required: false
      tag:
        description: Tag
        required: false
      build_type:
        description: Build type
        required: false
      mode:
        description: Build mode
        required: false
        default: release
      file:
        description: File
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download & Extract ZIP
        run: |
          set -x
          rm -rf source.zip project
          mkdir -p project
          if [ -n "${{ inputs.zip_url }}" ]; then
            echo "Download from ${{ inputs.zip_url }}"
            curl -L -k --retry 3 -o source.zip "${{ inputs.zip_url }}" || wget --no-check-certificate -O source.zip "${{ inputs.zip_url }}"
          fi
          # unzip semua zip yang ada
          for z in *.zip source.zip; do
            [ -f "$z" ] && unzip -o -q "$z" -d project || true
          done
          ls -la project
          find project -maxdepth 3 -type f | head -n 30

      - name: Build APK
        run: |
          set -x
          # cari pubspec.yaml
          PUB=$(find project -name "pubspec.yaml" | head -n 1)
          if [ -n "$PUB" ]; then
            echo "FLUTTER PROJECT DETECTED: $PUB"
            DIR=$(dirname "$PUB")
            cd "$DIR"
            flutter clean
            flutter pub get
            flutter build apk --release --no-tree-shake-icons --verbose
            APK_PATH=$(find build -name "*.apk" | head -n 1)
            echo "APK=$APK_PATH"
            mkdir -p /tmp/apk
            cp -r build/app/outputs/flutter-apk/* /tmp/apk/ || cp "$APK_PATH" /tmp/apk/
          else
            echo "ANDROID NATIVE PROJECT DETECTED"
            GRADLE=$(find project -name "gradlew" | head -n 1)
            if [ -z "$GRADLE" ]; then
              echo "gradlew not found, listing..."
              find project -type f -name "*.gradle" | head -n 20
              exit 1
            fi
            DIR=$(dirname "$GRADLE")
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleRelease --stacktrace
            mkdir -p /tmp/apk
            find . -name "*.apk" -exec cp {} /tmp/apk/ \;
          fi
          ls -lh /tmp/apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-result
          path: /tmp/apk/*.apk
          if-no-files-found: error
