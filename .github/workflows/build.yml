name: Build APK
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: ZIP
        required: false
      file:
        description: file
        required: false
      mode:
        description: mode
        required: false
        default: release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Download ZIP
        run: |
          rm -rf project
          mkdir project
          if [ -n "${{ inputs.zip_url }}" ]; then curl -L -k -o a.zip "${{ inputs.zip_url }}"; unzip -o a.zip -d project; fi
          if [ -f "${{ inputs.file }}" ]; then unzip -o "${{ inputs.file }}" -d project; fi
          find . -name "*.zip" -exec unzip -o {} -d project \;
          ls -R project | head -n 50
      - name: Build
        run: |
          PUB=$(find project -name pubspec.yaml | head -n 1)
          DIR=$(dirname "$PUB")
          cd "$DIR"
          flutter pub get
          flutter build apk --release
          mkdir -p /tmp/apk
          find . -name "*.apk" -exec cp {} /tmp/apk/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: /tmp/apk/*.apk
